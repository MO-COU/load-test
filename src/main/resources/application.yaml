spring:
  application:
    name: demo

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:coupon}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:coupon}
    password: ${DB_PASSWORD:coupon1234}
    hikari:
      # 통일 사항. 브랜치별로 바꾸면 비교가 성립하지 않는다.
      # 10(기본값)이면 모든 방식이 "커넥션 부족"이라는 같은 병목에 걸려
      # 락 전략의 차이가 묻힌다. MySQL 기본 max_connections(151) 안에 들어간다.
      maximum-pool-size: ${DB_POOL_SIZE:50}
      # 30초는 실패가 너무 늦게 드러난다. 10초면 결과 분석이 쉽다.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}

  jpa:
    hibernate:
      # 스키마는 scripts/db/schema.sql 이 관리한다.
      # validate 는 엔티티와 실제 스키마가 어긋나면 기동 시점에 바로 실패시켜서,
      # 잘못된 상태로 부하를 거는 사고를 막는다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:3000}
          max-idle: ${REDIS_POOL_MAX_IDLE:3000}
          min-idle: ${REDIS_POOL_MIN_IDLE:50}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      # 통일 사항.
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
