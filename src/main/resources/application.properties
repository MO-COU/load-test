spring.application.name=baseline

# 팀원 개인의 MySQL 접속 정보는 Git에 포함되지 않는 application-local.properties에서 읽는다.
spring.config.import=optional:classpath:application-local.properties
# application-local.properties의 db.* 값으로 MySQL 연결을 구성한다.
spring.datasource.url=jdbc:mysql://${db.host}:${db.port}/${db.name}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# 테이블 생성·변경은 SQL 초기화 스크립트가 담당하고, JPA는 매핑만 검증한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
