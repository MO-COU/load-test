services:
  mysql:
    image: mysql:8.0.36
    container_name: coupon-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 볼륨이 비어 있을 때만 실행된다. 스키마를 바꿨으면 docker compose down -v 필요.
      - ./scripts/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql
      # reset.sql 을 컨테이너 안에서 source 로 실행하기 위한 마운트.
      # 셸 리다이렉션(<)을 쓰지 않으므로 PowerShell 에서도 동일하게 동작한다.
      - ./scripts/db:/scripts:ro
    healthcheck:
      # -h 127.0.0.1 로 TCP 접속을 강제한다.
      # localhost 로 두면 소켓으로 붙기 때문에, 초기화 스크립트를 실행하는
      # 네트워크 꺼진 임시 서버에도 ping 이 성공해서 초기화 도중에 healthy 로 뜬다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8.1-alpine
    container_name: coupon-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data: